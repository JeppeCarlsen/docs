<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valiyou Docs OG Image Template</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #030712;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px;
    }

    .og-card {
      width: 1200px;
      height: 630px;
      background: #030712;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px;
    }

    /* Brand gradient in bottom right */
    .og-card::after {
      content: '';
      position: absolute;
      bottom: -300px;
      right: -300px;
      width: 1000px;
      height: 1000px;
      background-image: linear-gradient(
        238deg,
        #ebd6c7,
        #eea4bc 24%,
        #be88c4 48%,
        #9186e7 66%,
        #92c9f9 83%,
        #c7f8ff
      );
      filter: blur(120px);
      opacity: 0.6;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
    }

    .logo {
      width: 180px;
      height: auto;
      margin-bottom: 60px;
    }

    h1 {
      font-size: 72px;
      font-weight: 700;
      color: white;
      line-height: 1.1;
      margin-bottom: 24px;
      max-width: 900px;
    }

    .subtitle {
      font-size: 32px;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.4;
      max-width: 800px;
    }

    .badge {
      display: inline-block;
      background: rgba(112, 103, 252, 0.2);
      color: #7067fc;
      padding: 8px 20px;
      border-radius: 100px;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 32px;
      border: 1px solid rgba(112, 103, 252, 0.3);
    }

  </style>
</head>
<body>
  <!-- OG Card (1200x630) -->
  <div class="og-card">
    <div class="content">
      <!-- Logo - Replace with actual logo -->
      <svg class="logo" viewBox="0 0 200 40" fill="white">
        <text x="0" y="30" font-family="Arial, sans-serif" font-size="32" font-weight="700">Valiyou</text>
      </svg>

      <!-- Badge (optional) -->
      <div class="badge">Knowledge Center</div>

      <!-- Title - EDIT THIS -->
      <h1>Getting Started with Valiyou</h1>

      <!-- Subtitle - EDIT THIS -->
      <p class="subtitle">
        Learn how to set up and use Valiyou to measure attention value and manage sponsorships.
      </p>
    </div>
  </div>

</body>
</html>
